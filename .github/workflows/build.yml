name: Build ProGlide Compact
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build compact app
        shell: pwsh
        run: |
          ./build.ps1
          ./BuildSupport/package-portable.ps1 -OutputFolder ./publish
      - uses: actions/upload-artifact@v4
        with:
          name: ProGlide-Compact-Windows-x64
          path: publish/
